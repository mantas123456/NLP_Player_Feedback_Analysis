[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-nlp"
version = "2.0.0"
description = "Topic tagging, entities and lexicon sentiment for short customer feedback"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mantas Valantinavičius" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "spacy>=3.7,<3.9",
  "textblob>=0.18",
  "vaderSentiment>=3.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
